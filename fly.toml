app = "mental-health-api"
primary_region = "iad"

[build]
  dockerfile = "Mental_Health_Flask/Dockerfile"
  context = "."

[env]
  PORT = "8000"
  TF_CPP_MIN_LOG_LEVEL = "2"
  TF_ENABLE_ONEDNN_OPTS = "0"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
